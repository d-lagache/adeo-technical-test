services:
  db:
    image: postgres:18-alpine
    container_name: adeo-db
    restart: unless-stopped
    environment:
      # Identifiants de développement uniquement (base locale)
      POSTGRES_USER: adeo
      POSTGRES_PASSWORD: adeo
      POSTGRES_DB: adeo
    ports:
      - "5432:5432"
    volumes:
      # Depuis PostgreSQL 18, PGDATA vaut /var/lib/postgresql/18/docker :
      # on monte le répertoire parent pour faciliter les montées de version majeure.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
